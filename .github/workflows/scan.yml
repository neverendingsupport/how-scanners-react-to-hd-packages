name: Scan

on:
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # ratchet:actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # ratchet:actions/setup-node@v3
        with:
          node-version: 18
      - name: Setup .npmrc & npm install
        run: |
          cat <<EOF > ".npmrc"
          @neverendingsupport:registry=https://registry.dev.nes.herodevs.com/npm/pkg/
          //registry.dev.nes.herodevs.com/npm/pkg/:_authToken="${{ secrets.NES_ACCESS_TOKEN_HOW_SCANNER_WORK }}"
          EOF
          npm install

      - name: Snyk Scan
        uses: neverendingsupport/actions/snyk@2d5130d3aa58a494fb3882c5b527c88052170e8c # ratchet:neverendingsupport/actions/snyk@v1
        with:
          snykOrgId: ${{ secrets.SNYK_ORG_ID }}
          snykToken: ${{ secrets.SNYK_TOKEN }}
          snykThreshold: low

